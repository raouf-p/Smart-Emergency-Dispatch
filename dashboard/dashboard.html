<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غرفة العمليات المركزية - نظام النجدة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --primary: #3b82f6;
        --accent: #06b6d4;
        --text: #f8fafc;
    }
    body {
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text);
        font-family: Arial, sans-serif;
    }
    header {
        background: var(--card-bg);
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #334155;
    }
    .logo {
        font-size: 1.2rem;
        font-weight: bold;
    }
    .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 380px 320px;
        gap: 15px;
        padding: 15px;
    }
    .grid-box {
        background: var(--card-bg);
        border-radius: 8px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        border: 1px solid #334155;
        overflow: hidden;
    }
    .grid-box h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 1rem;
        color: #38bdf8;
    }
    .box-content {
        flex: 1;
        overflow-y: auto;
    }
    #map {
        width: 100%;
        height: 280px;
        border-radius: 6px;
        z-index: 1;
    }
    .alert-card {
        background: #334155;
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 0.85rem;
        border-right: 4px solid var(--primary);
    }
    .tag-high { border-right-color: #ef4444 !important; }
    .tag-medium { border-right-color: #f59e0b !important; }
</style>
</head>
<body>

<header>
    <div class="logo" id="headerTitle">🚨 مركز التحكم والعمليات</div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <span id="accountBadge" style="background: #334155; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; color: #fff;">القطاع : المديرية العامة</span>
        <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer;">تسجيل خروج</button>
    </div>
</header>

<div class="dashboard-grid">
    <div class="grid-box">
        <h3>🗺️ الخريطة التفاعلية</h3>
        <div id="map"></div>
    </div>
    
    <div class="grid-box">
        <h3>📋 البلاغات الواردة لقطاعك</h3>
        <div id="alertsContainer" class="box-content">
            <p style="color: #94a3b8; font-size: 0.9rem;">...جاري استقبال البلاغات</p>
        </div>
    </div>

    <div class="grid-box">
        <h3>📞 المكالمات الصوتية المباشرة</h3>
        <div class="box-content" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div id="callStatusText" style="font-size: 1rem; color: #38bdf8; margin-bottom: 10px;">📞 انتظار استقبال مكالمة...</div>
            <audio id="dispatchAudio" autoplay controls style="width: 100%; max-width: 250px;"></audio>
        </div>
    </div>

    <div class="grid-box">
        <h3>💬 المحادثة المباشرة مع المبلغين</h3>
        <div id="chatBox" class="box-content" style="margin-bottom: 8px; background: #0f172a; padding: 8px; border-radius: 6px; font-size: 0.85rem;"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chatInput" placeholder="اكتب رداً للمواطن..." style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 0.85rem;">
            <button onclick="sendChatMessage()" style="background: var(--accent); color: white; border: none; padding: 0 12px; border-radius: 6px; cursor: pointer;">إرسال</button>
        </div>
    </div>
</div>

<script>
let map = L.map('map').setView([36.165, 1.332], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let currentName = 'غرفة العمليات المركزية';

window.addEventListener('DOMContentLoaded', () => {
    setupDashboardUI();
});

function setupDashboardUI() {
    loadAlerts();
    loadChat();
    setInterval(loadAlerts, 3000);
    setInterval(loadChat, 3000);
}

function logout() {
    location.reload();
}

const peer = new Peer('dispatch_hq_chlef_server');
peer.on('call', call => {
    document.getElementById('callStatusText').style.color = '#22c55e';
    document.getElementById('callStatusText').textContent = '📞 مكالمة جارية بصوت حقيقي مع المواطن';
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(stream => {
        call.answer(stream);
        call.on('stream', remoteStream => {
            document.getElementById('dispatchAudio').srcObject = remoteStream;
        });
    });
});

function loadAlerts() {  
    fetch('/api/alerts')
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById('alertsContainer');
        container.innerHTML = '';
        if(!data || data.length === 0) {
            container.innerHTML = '<p style="color: #94a3b8; font-size: 0.9rem;">...لا توجد بلاغات حالياً</p>';
            return;
        }
        data.slice().reverse().forEach(alert => {
            const card = document.createElement('div');
            const severity = alert.ai_severity ? alert.ai_severity.toLowerCase() : 'medium';
            card.className = `alert-card tag-${severity}`;
            card.innerHTML = `
                <strong>[${alert.service || 'طوارئ'}] - خطورة : ${alert.ai_severity || 'عادية'}</strong>
                <p style="margin: 4px 0;">${alert.description || 'بدون وصف'}</p>
                <small style="color: #94a3b8;">📍 ${alert.address || 'موقع غير محدد'}</small>
            `;
            container.appendChild(card);
            if(alert.latitude && alert.longitude) {
                L.marker([alert.latitude, alert.longitude]).addTo(map).bindPopup(alert.description || 'بلاغ طوارئ');
            }
        });
    }).catch(err => console.log(err));
}

function loadChat() {
    fetch('/api/chat')
    .then(res => res.json())
    .then(messages => {
        const chatBox = document.getElementById('chatBox');
        if(messages && messages.length > 0) {
            chatBox.innerHTML = messages.map(m => `<div><strong>${m.sender}:</strong> ${m.text}</div>`).join('');
        }
    }).catch(err => console.log(err));
}

function sendChatMessage() {
    const input = document.getElementById('chatInput');
    if (!input.value.trim()) return;
    fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentName, text: input.value })
    }).then(() => {
        input.value = '';
        loadChat();
    });
}
</script>
</body>
</html>
