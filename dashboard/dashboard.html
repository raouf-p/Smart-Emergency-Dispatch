<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غرفة العمليات المركزية - نظام النجدة</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<header>
    <div class="logo" id="headerTitle">🚨 مركز التحكم والعمليات</div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <span id="accountBadge" style="background: #334155; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; color: #fff;">القطاع : المديرية العامة</span>
        <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer;">تسجيل خروج</button>
    </div>
</header>

<div class="dashboard-grid">
    <div class="grid-box">
        <h3>🗺️ الخريطة التفاعلية</h3>
        <div id="map" class="box-content" style="border-radius: 6px;"></div>
    </div>
    
    <div class="grid-box">
        <h3>📋 البلاغات الواردة لقطاعك</h3>
        <div id="alertsContainer" class="box-content">
            <p style="color: #94a3b8;">...جاري استقبال البلاغات</p>
        </div>
    </div>

    <div class="grid-box">
        <div class="box-content" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div id="callStatusText" style="font-size: 1.1rem; color: #38bdf8; margin-bottom: 15px;">📞 انتظار استقبال مكالمة...</div>
            <audio id="dispatchAudio" autoplay controls style="width: 100%; max-width: 300px;"></audio>
        </div>
    </div>

    <div class="grid-box">
        <h3>💬 المحادثة المباشرة مع المبلغين</h3>
        <div id="chatBox" class="box-content" style="margin-bottom: 10px; background: var(--bg-color); padding: 8px; border-radius: 6px; height: 150px; overflow-y: auto;"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chatInput" placeholder="اكتب رداً للمواطن..." style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white;">
            <button onclick="sendChatMessage()" style="background: var(--accent); color: white; border: none; padding: 0 15px; border-radius: 6px; cursor: pointer;">إرسال</button>
        </div>
    </div>
</div>

<script>
let map = L.map('map').setView([36.165, 1.332], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let currentRole = 'admin';
let currentName = 'غرفة العمليات المركزية';

window.addEventListener('DOMContentLoaded', () => {
    setupDashboardUI();
});

function setupDashboardUI() {
    loadAlerts();
    loadChat();
    setInterval(loadAlerts, 4000);
    setInterval(loadChat, 3000);
}

function logout() {
    location.reload();
}

const peer = new Peer('dispatch_hq_chlef_server');
peer.on('call', call => {
    document.getElementById('callStatusText').style.color = '#22c55e';
    document.getElementById('callStatusText').textContent = '📞 مكالمة جارية بصوت حقيقي مع المواطن';
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(stream => {
        call.answer(stream);
        call.on('stream', remoteStream => {
            document.getElementById('dispatchAudio').srcObject = remoteStream;
        });
    });
});

function loadAlerts() {
    fetch(`/api/alerts?role=${encodeURIComponent(currentRole)}`)
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById('alertsContainer');
        container.innerHTML = '';
        data.slice().reverse().forEach(alert => {
            const card = document.createElement('div');
            card.className = `alert-card tag-${alert.ai_severity.toLowerCase()}`;
            card.innerHTML = `
                <strong>[${alert.service}] - خطورة : ${alert.ai_severity}</strong>
                <p style="margin: 4px 0;">${alert.description}</p>
                <small style="color: #94a3b8;">📍 ${alert.address}</small>
            `;
            container.appendChild(card);
            L.marker([alert.latitude, alert.longitude]).addTo(map).bindPopup(alert.description);
        });
    });
}

function loadChat() {
    fetch('/api/chat')
    .then(res => res.json())
    .then(messages => {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = messages.map(m => `<div><strong>${m.sender}:</strong> ${m.text}</div>`).join('');
    });
}

function sendChatMessage() {
    const input = document.getElementById('chatInput');
    if (!input.value.trim()) return;
    fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentName, text: input.value })
    }).then(() => {
        input.value = '';
        loadChat();
    });
}
</script>
</body>
</html>
