<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غرفة العمليات المركزية - نظام النجدة</title>
  <link rel="stylesheet" href="../complaints/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
      height: calc(100vh - 80px);
      padding: 15px;
      box-sizing: border-box;
    }
    #map {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .alert-card {
      background: var(--bg-color);
      border-right: 4px solid var(--primary);
      padding: 10px;
      border-radius: 4px;
    }
    .otp-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-box {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- شاشة التحقق بالرمز OTP -->
  <div id="otpModal" class="otp-modal">
    <div class="modal-box">
      <h3>🚨 تأكيد دخول غرفة العمليات</h3>
      <p>اضغط للحصول على رمز الدخول المرسل لبريد النجدة الرسمي.</p>
      <button onclick="requestOTP()" class="btn-submit" style="margin-bottom: 10px;">إرسال كود التحقق البريدي</button>
      <input type="text" id="otpCode" placeholder="أدخل الكود المكون من 6 أرقام" style="text-align: center; letter-spacing: 4px; font-size: 1.2rem;">
      <button onclick="verifyOTP()" class="btn-submit" style="margin-top: 10px; background: #22c55e;">تأكيد الدخول</button>
      <div id="otpStatus" style="margin-top: 10px; font-size: 0.85rem;"></div>
    </div>
  </div>

  <header>
    <div class="logo">🚨 غرفة العمليات والتحكم للنجدة</div>
    <div class="nav-links">
      <span style="color: #4ade80;">● الاتصال المباشر مفعل</span>
    </div>
  </header>

  <div class="dashboard-grid">
    <div id="map"></div>
    <div class="panel">
      <h3>البلاغات الواردة والدردشة</h3>
      <div id="alertsContainer">
        <p style="color: #94a3b8;">جاري استقبال البلاغات...</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([36.165, 1.332], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    function requestOTP() {
      const status = document.getElementById('otpStatus');
      status.style.color = '#38bdf8';
      status.textContent = "جاري طلب الكود...";
      fetch('/api/request-otp', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
          status.textContent = data.message;
        });
    }

    function verifyOTP() {
      const code = document.getElementById('otpCode').value;
      const status = document.getElementById('otpStatus');
      fetch('/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      })
      .then(res => res.json())
      .then(data => {
        if (data.verified) {
          document.getElementById('otpModal').style.display = 'none';
          loadAlerts();
          setInterval(loadAlerts, 5000);
        } else {
          status.style.color = '#ef4444';
          status.textContent = data.message;
        }
      });
    }

    function loadAlerts() {
      fetch('/api/alerts')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('alertsContainer');
          if (data.length === 0) {
            container.innerHTML = '<p style="color: #94a3b8;">لا توجد بلاغات طوارئ حالياً.</p>';
            return;
          }
          container.innerHTML = '';
          data.reverse().forEach(alert => {
            const card = document.createElement('div');
            card.className = 'alert-card';
            card.innerHTML = `
              <strong>[${alert.service}] درجة الخطورة: ${alert.ai_severity}</strong>
              <p style="margin: 5px 0;">${alert.description}</p>
              <small style="color: #94a3b8;">${alert.address}</small>
            `;
            container.appendChild(card);

            L.marker([alert.latitude, alert.longitude])
              .addTo(map)
              .bindPopup(`<b>${alert.service}</b><br>${alert.description}`);
          });
        });
    }
  </script>
</body>
</html>
