<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الأمني - نظام الطوارئ الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1>🚨 نظام الطوارئ الذكي - الشلف</h1>
        <p class="subtitle">الرجاء اختيار القطاع الأمني وإدخال كلمة السر السرية الخاصة بالوحدة للمتابعة</p>
        
        <div class="sectors-grid">
      
            <div class="sector-card" onclick="openLoginModal('civil', 'الحماية المدنية')">
                <span class="sector-icon">🚒</span>
                <h3>الحماية المدنية</h3>
            </div>

   
            <div class="sector-card" onclick="openLoginModal('police', 'الشرطة')">
                <span class="sector-icon">👮‍♂️</span>
                <h3>الشرطة</h3>
            </div>


            <div class="sector-card" onclick="openLoginModal('gendarmerie', 'الدرك الوطني')">
                <span class="sector-icon">🛡️</span>
                <h3>الدرك الوطني</h3>
            </div>

 
            <div class="sector-card" onclick="openLoginModal('hospital', 'مستشفى الشلف (الإسعاف)')">
                <span class="sector-icon">🏥</span>
                <h3>مستشفى الشلف</h3>
            </div>
        </div>
    </div>

  
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h3 id="modalTitle">تسجيل دخول القطاع</h3>
            <p style="font-size: 14px; color: #94a3b8;">أدخل كلمة السر السرية الخاصة بالعناصر المعتمدين في الشلف:</p>
            
      
            <div class="password-wrapper">
                <input type="password" id="sectorPassword" placeholder="أدخل كلمة السر السرية...">
                <span class="toggle-eye" id="toggleEyeBtn" onclick="togglePasswordVisibility()">👁️‍🗨️</span>
            </div>

            <button id="loginBtn" onclick="verifyPassword()">دخول غرفة العمليات</button>
            <div class="error-msg" id="errorMsg">❌ كلمة السر غير صحيحة!</div>
            <div class="lockout-msg" id="lockoutMsg" style="display: none; color: #ef4444; font-weight: bold; margin-top: 10px;"></div>
            
            <button class="close-btn" onclick="closeLoginModal()">إلغاء</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
