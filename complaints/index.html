<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الطوارئ والبلاغات الذكي</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // توجيه مستخدم الحاسوب تلقائياً إلى غرفة العمليات
    window.addEventListener('DOMContentLoaded', () => {
      if (window.innerWidth > 768) {
        window.location.href = '/dashboard/';
      }
    });
  </script>
</head>
<body>

  <header>
    <div class="logo">🚨 نظام الطوارئ الذكي</div>
    <ul class="nav-links">
      <li><a href="/complaints/" class="active citizen-link">تقديم بلاغ</a></li>
      <li><a href="/tips/" class="citizen-link">إرشادات السلامة</a></li>
      <li><a href="/about/" class="citizen-link">عن النظام</a></li>
      <li><a href="/dashboard/" class="staff-btn">أنا أصلاً من النجدة 🚨</a></li>
    </ul>
  </header>

  <div class="container">
    <h2>تقديم بلاغ طوارئ عاجل</h2>
    <p>يتم تحديد موقعك التلقائي وإرساله لفرق النجدة فور التأكيد.</p>

    <form id="sosForm">
      <div class="form-group">
        <label for="service">جهة الطوارئ المطلوبة:</label>
        <select id="service" required>
          <option value="الحماية المدنية">الحماية المدنية (الإسعاف والإطفاء)</option>
          <option value="الشرطة">الشرطة والأمن الوطني</option>
          <option value="الدرك الوطني">الدرك الوطني</option>
          <option value="طوارئ عامة">طوارئ عامة</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">وصف حالة الطوارئ:</label>
        <textarea id="description" rows="4" placeholder="اكتب تفاصيل ما حدث (مثال: حادث سير، حريق، إصابة...)" required></textarea>
      </div>

      <button type="submit" class="btn-submit">🚨 إرسال البلاغ فوراً مع الموقع</button>
    </form>

    <div id="statusMsg" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
  </div>

  <script>
    document.getElementById('sosForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.style.color = '#38bdf8';
      statusDiv.textContent = "جاري تحديد موقعك الـ GPS وإرسال البلاغ...";

      if (!navigator.geolocation) {
        statusDiv.style.color = '#ef4444';
        statusDiv.textContent = "خاصية الموقع غير مدعومة في متصفحك.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const payload = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            service: document.getElementById('service').value,
            description: document.getElementById('description').value
          };

          fetch('/api/sos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              statusDiv.style.color = '#4ade80';
              statusDiv.textContent = "تم إرسال البلاغ بنجاح! تم تحديد الموقع ودرجة الخطورة: " + data.result.ai_severity;
              document.getElementById('sosForm').reset();
            } else {
              statusDiv.style.color = '#ef4444';
              statusDiv.textContent = "حدث خطأ: " + data.message;
            }
          })
          .catch(() => {
            statusDiv.style.color = '#ef4444';
            statusDiv.textContent = "تعذر الاتصال بالسيرفر.";
          });
        },
        () => {
          statusDiv.style.color = '#ef4444';
          statusDiv.textContent = "يرجى السماح بصلاحية الموقع الجغرافي (GPS) لإرسال البلاغ.";
        }
      );
    });
  </script>
</body>
</html>
