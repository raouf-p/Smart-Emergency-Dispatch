<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">نظام الطوارئ - تقديم بلاغ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <header>
    <div class="logo" id="logoText">🚨 نظام الطوارئ الذكي</div>
    <ul class="nav-links">
      <li><a href="/complaints/" class="active" id="navComplaints">صفحة الشكاوي</a></li>
      <li><a href="/tips/" id="navTips">النصائح</a></li>
      <li><a href="/about/" id="navAbout">عنّا</a></li>
    </ul>
    <div class="controls">
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ar">العربية</option>
        <option value="eng">ENG</option>
        <option value="fra">FRA</option>
      </select>
      <button id="themeToggle" onclick="toggleTheme()">🌙</button>
    </div>
  </header>

  <div class="main-container">
    <h2 class="page-title" id="mainHeaderTitle">اختر مصلحة الطوارئ المطلوبة</h2>

    <div class="sectors-grid">
      <div class="sector-card" onclick="selectSector('الحماية المدنية', this)">
        <div class="sector-icon">🚒</div>
        <h3 id="sectorCivil">الحماية المدنية</h3>
      </div>
      <div class="sector-card" onclick="selectSector('الشرطة', this)">
        <div class="sector-icon">🚓</div>
        <h3 id="sectorPolice">الشرطة</h3>
      </div>
      <div class="sector-card" onclick="selectSector('الدرك الوطني', this)">
        <div class="sector-icon">🚔</div>
        <h3 id="sectorGendarmerie">الدرك الوطني</h3>
      </div>
      <div class="sector-card" onclick="selectSector('السلامة العامة', this)">
        <div class="sector-icon">⚠️</div>
        <h3 id="sectorSafety">السلامة العامة</h3>
      </div>
    </div>

    <div id="actionPanel" class="action-panel" style="display: none;">
      <h3 id="panelTitle" class="panel-title">الخدمة المحددة</h3>
      
      <div class="action-buttons">
        <button type="button" class="btn-call" onclick="showCallSection()" id="btnCallText">📞 اتصل بنا (مكالمة صوتية)</button>
        <button type="button" class="btn-msg" onclick="showMsgSection()" id="btnMsgText">✉️ إرسال رسالة بلاغ</button>
      </div>

      <div id="callSection" class="sub-section" style="display: none;">
        <button type="button" class="btn-start-call" onclick="startVoiceCall()" id="btnStartCallText">🎙️ بدء الاتصال الصوتي المباشر</button>
        <div id="callStatus">غير متصل حالياً</div>
        <audio id="remoteAudio" autoplay></audio>
      </div>

      <div id="msgSection" class="sub-section" style="display: none;">
        <form id="sosForm">
          <label id="labelDesc">وصف حالة الطوارئ:</label>
          <textarea id="description" rows="3" placeholder="اكتب تفاصيل الحالة هنا..." required></textarea>
          <button type="submit" class="btn-submit" id="btnSubmitText">📍 إرسال البلاغ والموقع الآن</button>
        </form>
        <div id="statusMsg"></div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
